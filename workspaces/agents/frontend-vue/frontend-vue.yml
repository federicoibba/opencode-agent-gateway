# Frontend (Vue) — a specific agent built on the generic frontend one.
#
# `extends: frontend` inherits its base_model, tags, MCPs, skills and system
# prompt; this file only states the differences. `prompt_append` is concatenated
# after the inherited prompt. The `vue` skill lives in this folder's `skills/`
# and is attached implicitly.
name: Frontend (Vue)
description: Frontend agent specialised for Vue 3 apps and component libraries.
extends: frontend
folder: Frontend (Vue)
tags: [vue]

prompt_append: |
  ## Vue specifics

  You specialise in Vue 3: the Composition API with `<script setup>`, Volar and
  vue-tsc, Pinia for state and Vue Router. Prefer the project's existing setup and
  conventions, and load the `vue` skill when writing or reviewing Vue code.
