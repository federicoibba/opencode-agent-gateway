services:
  # agentgateway runs as uid 65532 (distroless, non-root) but a freshly created
  # named volume is root-owned, so it cannot create its SQLite database. This
  # one-shot chowns the volume to the gateway's uid before it starts. It is a
  # no-op when ownership is already correct, and it also repairs the volume after
  # `mise run destroy` (which deletes it and lets Docker recreate it empty).
  agentgateway-data-init:
    image: alpine:3.20
    user: "0:0"
    volumes:
      - agentgateway-data:/data
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    restart: "no"

  agentgateway:
    image: cr.agentgateway.dev/agentgateway:latest
    ports:
      - "3000:3000"
      # Admin UI: published on host loopback only (it is unauthenticated).
      - "127.0.0.1:15000:15000"
      # MCP listener (config.yml `gateways.default` port 4000): loopback only,
      # for the gateway UI's Tool Playground. open-webui reaches it over the
      # compose network and does not need this mapping.
      - "127.0.0.1:4000:4000"
    volumes:
      # Read-write so the admin UI can save config changes back to the host file.
      - ./config.yml:/config.yml
      # SQLite request-log store behind the UI's Logs/Analytics pages.
      # Must be a named volume, not a host bind mount: SQLite's locking/mmap
      # is unreliable on Docker Desktop's macOS file sharing (disk I/O error 522).
      - agentgateway-data:/data
    command: ["-f", "/config.yml"]
    environment:
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
    depends_on:
      agentgateway-data-init:
        condition: service_completed_successfully

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3080:8080"
    environment:
      # Client key toward the gateway; the gateway swaps in the real Go key.
      - OPENAI_API_BASE_URL=http://agentgateway:3000/v1
      - OPENAI_API_KEY=placeholder
      # Optional headless bootstrap of the first admin. When both are set on a
      # fresh install, open-webui creates this account at startup and disables
      # open sign-up, so `workspace-sync` can sign in and seed the workspaces
      # without any manual step. Leave unset to create the admin in the UI and
      # set OPENWEBUI_API_KEY instead (see .env.example).
      - WEBUI_ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL:-}
      - WEBUI_ADMIN_PASSWORD=${WEBUI_ADMIN_PASSWORD:-}
      # Pre-wire the gateway's MCP endpoint as an external tool server so it shows
      # up in every chat (no manual Admin > Integrations step). open-webui treats
      # this as a persisted setting: it seeds from here only while no value is
      # stored. To re-seed after changing it, delete the stored row:
      #   delete from config where key='tool_server.connections';
      # `path` is required by open-webui's ToolServerConnection model even for MCP
      # (its config endpoint 500s without it, which makes the UI spin forever).
      - 'TOOL_SERVER_CONNECTIONS=[{"type":"mcp","url":"http://agentgateway:4000/mcp","path":"","auth_type":"none","key":"","config":{"enable":true},"info":{"id":"agentgateway","name":"agentgateway MCP","description":"Tools exposed by the agentgateway MCP endpoint"}}]'
      # Make the MCP server a default tool on every model, so a chat does not need
      # the per-chat (or per-model editor) toggle. Same persisted-setting caveat as
      # above: re-seed by deleting the stored row `models.default_metadata`.
      - 'DEFAULT_MODEL_METADATA={"toolIds":["server:mcp:agentgateway"]}'
      # NOTE: for per-conversation session IDs, add this custom header on the
      # OpenAI connection in Admin > Connections (persists in the data volume):
      #   { "x-opencode-session": "{{CHAT_ID}}" }
      # Without it the gateway still derives a per-chat ID from message content.
    depends_on:
      - agentgateway
    volumes:
      - open-webui:/app/backend/data
    healthcheck:
      # Used by workspace-sync (depends_on: service_healthy) so it waits for the
      # API to answer before it starts creating models/skills/prompts.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health', timeout=5).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # One-shot: reconciles workspaces/<domain>/ in this repo into open-webui's
  # Workspace (Models, Skills, Prompts). Runs on every `docker compose up`, is
  # idempotent, and exits 0 (with a warning) when no credentials are configured.
  # Re-run on demand with `mise run sync-workspaces` (docker compose run --rm workspace-sync).
  workspace-sync:
    image: python:3.14-slim
    depends_on:
      open-webui:
        condition: service_healthy
    volumes:
      - ./workspaces:/workspaces:ro
      - ./tools:/tools:ro
    environment:
      - OPENWEBUI_URL=http://open-webui:8080
      - OPENWEBUI_API_KEY=${OPENWEBUI_API_KEY:-}
      - WEBUI_ADMIN_EMAIL=${WEBUI_ADMIN_EMAIL:-}
      - WEBUI_ADMIN_PASSWORD=${WEBUI_ADMIN_PASSWORD:-}
    command: ["python", "/tools/workspace_sync.py", "--workspaces", "/workspaces", "--url", "http://open-webui:8080"]
    restart: "no"

volumes:
  open-webui:
  agentgateway-data:
