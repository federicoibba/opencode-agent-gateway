services:
  agentgateway:
    image: cr.agentgateway.dev/agentgateway:latest
    ports:
      - "3000:3000"
      # Admin UI: published on host loopback only (it is unauthenticated).
      - "127.0.0.1:15000:15000"
    volumes:
      # Read-write so the admin UI can save config changes back to the host file.
      - ./config.yml:/config.yml
      # SQLite request-log store behind the UI's Logs/Analytics pages.
      # Must be a named volume, not a host bind mount: SQLite's locking/mmap
      # is unreliable on Docker Desktop's macOS file sharing (disk I/O error 522).
      - agentgateway-data:/data
    command: ["-f", "/config.yml"]
    environment:
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3080:8080"
    environment:
      # Client key toward the gateway; the gateway swaps in the real Go key.
      - OPENAI_API_BASE_URL=http://agentgateway:3000/v1
      - OPENAI_API_KEY=placeholder
      # NOTE: for per-conversation session IDs, add this custom header on the
      # OpenAI connection in Admin > Connections (persists in the data volume):
      #   { "x-opencode-session": "{{CHAT_ID}}" }
      # Without it the gateway still derives a per-chat ID from message content.
    depends_on:
      - agentgateway
    volumes:
      - open-webui:/app/backend/data

volumes:
  open-webui:
  agentgateway-data:
